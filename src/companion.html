<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  :root {
    /* Palette taken from the character sheet: shirt olive, mundu cream, stripe green, accent gold. */
    --cream-hi: #fffdf3; --cream-lo: #f4e8c8; --edge: #c8ad66; --ink: #3a3417;
    --green-hi: #55b45a; --green-lo: #2e7d32; --green-edge: #1b5e20;
    --gold-hi: #ffd96e; --gold-lo: #f5b53b; --gold-edge: #b9802a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  #stage { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  #avatar {
    position: absolute; left: 0; bottom: 0; width: 125px; height: 260px;
    cursor: grab; will-change: transform; transform-origin: 50% 100%;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .32));
    transition: filter .2s ease;
  }
  #avatar.dragging { cursor: grabbing; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .45)); }
  #sprite { width: 100%; height: 100%; display: block; pointer-events: none; }

  /* Speech bubble: soft clay/3D look to match the character render. */
  #bubble {
    position: absolute; display: none; align-items: center; gap: 12px;
    max-width: 330px; padding: 12px 18px 12px 12px; border-radius: 26px;
    background: linear-gradient(180deg, var(--cream-hi) 0%, var(--cream-lo) 100%);
    border: 2px solid rgba(200, 173, 102, .55);
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, .95),
      inset 0 -5px 0 rgba(200, 173, 102, .28),
      0 6px 0 var(--edge),
      0 16px 24px rgba(40, 30, 0, .32);
    transform-origin: var(--tail, 50%) 100%;
  }
  #bubble.pop { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes pop { 0% { transform: scale(.4) translateY(14px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
  #bubble::after { /* tail */
    content: ""; position: absolute; bottom: -11px; left: var(--tail, 50%); width: 20px; height: 20px;
    margin-left: -10px; transform: rotate(45deg); border-radius: 0 0 7px 0;
    background: var(--cream-lo); border-right: 2px solid rgba(200, 173, 102, .55); border-bottom: 2px solid rgba(200, 173, 102, .55);
    box-shadow: 3px 5px 0 var(--edge);
  }
  #face {
    flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
    border: 3px solid #fff; background: radial-gradient(circle at 35% 30%, #f6f6f6, #d9d9d9);
    box-shadow: 0 4px 0 var(--edge), 0 8px 12px rgba(40, 30, 0, .3), inset 0 0 8px rgba(0, 0, 0, .18);
  }
  #face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; transform: scale(1.1); display: block; }
  #text { font: 600 15px/1.35 "Segoe UI", "Nirmala UI", sans-serif; color: var(--ink); text-shadow: 0 1px 0 rgba(255, 255, 255, .8); }
  #row { margin-top: 10px; display: flex; gap: 8px; }
  #row:empty { display: none; }
  #row button {
    border: 0; border-radius: 13px; padding: 6px 14px 7px; cursor: pointer;
    font: 700 13px "Segoe UI", sans-serif; color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, .35);
    background: linear-gradient(180deg, var(--green-hi), var(--green-lo));
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .38), 0 4px 0 var(--green-edge), 0 7px 10px rgba(0, 0, 0, .25);
    transition: transform .06s, box-shadow .06s;
  }
  #row button.alt {
    color: #5a3d00; text-shadow: 0 1px 0 rgba(255, 255, 255, .5);
    background: linear-gradient(180deg, var(--gold-hi), var(--gold-lo));
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .5), 0 4px 0 var(--gold-edge), 0 7px 10px rgba(0, 0, 0, .25);
  }
  #row button:hover { filter: brightness(1.06); }
  #row button:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .3), 0 1px 0 var(--green-edge); }
  #row button.alt:active { box-shadow: inset 0 2px 0 rgba(255, 255, 255, .4), 0 1px 0 var(--gold-edge); }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"><div id="face"><img id="faceImg" alt=""></div><div><div id="text"></div><div id="row"></div></div></div>
  <div id="avatar"><canvas id="sprite"></canvas></div>
</div>
<script src="companion.js"></script>
</body>
</html>

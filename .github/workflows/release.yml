name: Release

# Push a tag like v2.0.0 to build the Windows installer and the macOS disk image
# and publish them together as one GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build both installers without publishing, to test the pipeline

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            files: |
              dist/Damu-Setup-*.exe
              dist/Damu-Setup-*.exe.blockmap
          - os: macos-latest
            dist: dist:mac
            files: |
              dist/Damu-*-mac-*.dmg
              dist/Damu-*-mac-*.dmg.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.dist }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

name: Release

# Push a tag like v1.0.0 to build the installer and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Damu Setup *.exe
            dist/Damu Setup *.exe.blockmap
          generate_release_notes: true
